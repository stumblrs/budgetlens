    <ellipse cx="133" cy="91" rx="4.5" ry="8.5" fill="#7a4c32"/>
    <!-- Glasses -->
    <rect x="76" y="75" width="20" height="13" rx="4" fill="none" stroke="#0f172a" stroke-width="2"/>
    <rect x="104" y="75" width="20" height="13" rx="4" fill="none" stroke="#0f172a" stroke-width="2"/>
    <line x1="96" y1="81" x2="104" y2="81" stroke="#0f172a" stroke-width="2"/>
    <circle cx="86" cy="81" r="2.6" fill="#0f172a"/>
