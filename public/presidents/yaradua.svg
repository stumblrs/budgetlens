    <path d="M24 200 C28 148 58 136 100 136 C142 136 172 148 176 200 Z" fill="#f1f5f9"/>
    <path d="M82 137 L100 176 L118 137" fill="none" stroke="#0284c7" stroke-width="3.5"/>
