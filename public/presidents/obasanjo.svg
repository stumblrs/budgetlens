<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Olusegun Obasanjo">
  <defs>
    <linearGradient id="bg-obj" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <clipPath id="circle-obj">
      <circle cx="100" cy="100" r="96"/>
    </clipPath>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#bg-obj)" stroke="#34d399" stroke-width="4"/>
  <g clip-path="url(#circle-obj)">
    <!-- Agbada Robe -->
    <path d="M22 200 C25 148 56 135 100 135 C144 135 175 148 178 200 Z" fill="#f8fafc"/>
    <path d="M75 136 L100 175 L125 136" fill="none" stroke="#10b981" stroke-width="4"/>
    <path d="M62 142 L62 200 M138 142 L138 200" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Neck -->
    <rect x="85" y="114" width="30" height="28" rx="10" fill="#6d4329"/>
    <!-- Head / Face -->
    <ellipse cx="100" cy="88" rx="34" ry="39" fill="#7c4d30"/>
    <!-- Ears -->
    <ellipse cx="65" cy="90" rx="5" ry="9" fill="#6d4329"/>
    <ellipse cx="135" cy="90" rx="5" ry="9" fill="#6d4329"/>
    <!-- Subtle smile & nose -->
    <path d="M100 76 L97 94 L103 95" fill="none" stroke="#4a2c19" stroke-width="2" stroke-linecap="round"/>
    <path d="M88 106 Q100 113 112 106" fill="none" stroke="#4a2c19" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Eyes & Brows -->
    <path d="M81 74 Q88 70 94 74" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M106 74 Q112 70 119 74" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="88" cy="80" r="3" fill="#1e293b"/>
    <circle cx="112" cy="80" r="3" fill="#1e293b"/>
    <!-- Yoruba Fila Cap -->
    <path d="M64 62 Q100 32 136 62 L133 44 Q100 22 68 46 Z" fill="#0f766e"/>
    <path d="M66 60 Q100 48 134 60" fill="none" stroke="#a7f3d0" stroke-width="2.5"/>
  </g>
</svg>
