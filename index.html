<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <title>BudgetLens — Nigeria Federal Fiscal Observatory (1999–2026)</title>
    <meta name="description" content="Open civic and forensic budget observatory indexing Nigerian Federal Appropriation Acts (1999–2026) and DMO public debt records with reproducible, verbatim PDF provenance." />
    <meta name="author" content="BudgetLens Civic Fiscal Observatory" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BudgetLens Civic Fiscal Observatory" />
    <meta property="og:title" content="BudgetLens — Nigeria Federal Fiscal Observatory (1999–2026)" />
    <meta property="og:description" content="Inspect, cite, and export verbatim Federal Appropriation Act schedules, presidential spending comparisons, and public debt records across 1999–2026." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BudgetLens — Nigeria Federal Fiscal Observatory (1999–2026)" />
    <meta name="twitter:description" content="Verifiable Nigerian public finance intelligence across 1999–2026 with verbatim PDF page citations and DMO debt provenance." />
    
    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#091017" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BudgetLens" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
      // Service Worker Registration for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('BudgetLens ServiceWorker registered:', reg.scope))
            .catch(err => console.error('ServiceWorker registration failed:', err));
        });
      }
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
